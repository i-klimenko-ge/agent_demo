<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Демо агента</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            margin: 0;
            background: #343541;
            color: #e6e6e6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            resize: vertical;
            background: #40414f;
            color: #e6e6e6;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 4px;
        }

        #container {
            display: flex;
            gap: 20px;
            flex: 1;
            padding: 20px;
        }

        #left {
            width: 30%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #right {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        #history {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            background: #40414f;
            color: #e6e6e6;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        #history pre,
        #history code {
            white-space: pre-wrap;
            word-break: break-word;
        }

        #user-input {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        #user-msg {
            flex: 1;
            height: 40px;
            box-sizing: border-box;
            background: #40414f;
            color: #e6e6e6;
            border: 1px solid #555;
            padding: 0 10px;
            border-radius: 4px;
        }

        #send-btn {
            height: 40px;
            background: #10a37f;
            border: none;
            color: #fff;
            padding: 0 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        #reset-btn {
            height: 40px;
            background: #2f74c0;
            border: none;
            color: #fff;
            padding: 0 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        #retry-btn {
            height: 40px;
            background: #2f74c0;
            border: none;
            color: #fff;
            padding: 0 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        #retry-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #tools,
        #available-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            border: 1px solid #555;
            padding: 10px;
            min-height: 50px;
            background: #272727;
            border-radius: 4px;
        }

        .tool {
            padding: 5px 10px;
            background: #3e3e3e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            color: #e6e6e6;
        }

        .tool:hover {
            background: #4b4b4b;
        }

        #extra-prompt.inactive {
            opacity: 0.5;
            background: #2d2d2d;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #202123;
            padding: 20px;
        }

        #header h1 {
            margin: 0;
            color: #fff;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
<div id="header">
    <h1>Демо агента</h1>
    <button id="reset-btn">Переподключиться</button>
</div>
<div id="container">
    <div id="left">
        <label>Системный промпт:</label>
        <textarea id="system-prompt">  ## Описание задачи
  Вы являетесь интеллектуальным помощником.
  Ваша задача — помогать пользователям, предоставляя точную и полезную информацию.
  
  У вас есть доступ к нескольким инструментам (tools), пользуйтесь ими для ответа.
  Предоставляйте ответ пользователю после того, как найдете ответы на все заданные вопросы пользователя. Перед ответом убедитесь, что отвечаете именно на то, что было запрошено и отвечаете в полном объеме.
  Если не получилось найти ответ на вопрос пользователя, попробуйте разбить его на части и найти ответы на них.

  ## ВАЖНО! Обратите внимание, что один из инструментов должен быть использован обязательно! Отсутствие вызова инструмента приведет к поломке системы.</textarea>
        <label><input type="checkbox" id="enable-extra" checked> Дополнительный промпт:</label>
        <textarea id="extra-prompt">  ## Формат ответа
  Каждый ваш ответ должен содержать следующие разделы:

  ### 1. Reflection
  - Оцените предыдущие действия и их эффективность.
  - Определите необходимость корректировки плана действий.
  - Если это первый запрос, укажите, что корректировка не требуется.

  ### 2. Planning
  - Чётко разбейте задачу на шаги.
  - Определите последовательность действий и поясните свой план.

  ### 3. Thought
  - Объясните, почему выбирается именно это действие.
  - Укажите, какие аргументы передаются и для чего.

  ### 4. Action
  - Укажите инструмент, который выбрали, и передаваемые в него параметры

  ## Пример правильного ответа

  **Пользователь**
    Сколько людей живет в Омске, каковы продолжительность их жизни и гендерный состав?

  **Ассистент**
  Reflection
    Это первый запрос пользователя, корректировка плана действий не требуется. Составим план, в котором применим комплексный подход с использованием нескольких источников. Сообщение содержит в себе три вопроса, составим план для ответа на все.

  Planning
    1. Найти информацию о населении Омска. Для этого используем источник "demographics".
    2. Узнать продолжительность жизни. Для этого обратимся к источнику "demographics", а если там нет информации, то к источнику "healthcare".
    3. Уточнить данные о гендерном составе. Для этого обратимся к источнику "demographics".

  Thought
    Сначала получим данные о населении из источника "demographics". Если нужная информация не найдётся, попробуем другие источники. Аналогично поступим с продолжительностью жизни и гендерным составом.

  Action:
  ```python
  search_rag(query="население Омска", sources=['demographics'])
  ```</textarea>
        <h3>Доступные инструменты</h3>
        <div id="available-tools"></div>
        <h3>Выбранные инструменты</h3>
        <div id="tools"></div>
    </div>
    <div id="right">
        <label>Чат:</label>
        <div id="history"></div>
        <label>Сообщение:</label>
        <div id="user-input">
            <input type="text" id="user-msg" />
            <button id="send-btn">Отправить</button>
            <button id="retry-btn" disabled>Повторить</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
